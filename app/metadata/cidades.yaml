cidades:
  config:
    source: api
    layer: bronze
    description: Person data from CRM

  columns:

    cod_cidade:      
      role: bk
      hash_key: hk_cidade
      dtype: int64
      nullable: false
      description: cod_cidade

    nome:      
      role: attribute
      dtype: string
      nullable: false
      description: Nome

    habitantes:
      role: attribute
      dtype: int64
      nullable: false
      description: habitantes

    renda_percapita:
      role: attribute
      dtype: float64
      nullable: false      
      description: renda_percapita

    cod_estado:      
      role: fk
      hash_key: hk_estado
      dtype: int64
      nullable: false
      description: cod_estado

    data_criacao:
      role: metadata
      dtype: datetime64[ns]
      nullable: false
      description: Load timestamp

    data_alteracao:
      role: metadata
      dtype: datetime64[ns]
      nullable: false
      description: Load timestamp